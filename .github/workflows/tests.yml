# Тесты: unit без Docker, интеграционные по проектам (Testcontainers), E2E, проверка уязвимых пакетов
name: tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet build StepanCarSevice.Server.sln
      # Без БД и брокера: Docker не используется
      - run: >
          dotnet test StepanCarSevice.Server.sln --no-build
          --filter Category=Unit
          --collect "XPlat Code Coverage" --results-directory TestResults/unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: TestResults/unit/**/coverage.cobertura.xml

  integration:
    name: Integration (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        project: [Common, AuthService, TenantService, DetailService, VisitService]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      # PostgreSQL и RabbitMQ поднимает Testcontainers (Docker есть на ubuntu-latest)
      - run: >
          dotnet test tests/StepanCarService.${{ matrix.project }}.Tests
          --filter "Category!=Unit&Category!=Performance"
          --collect "XPlat Code Coverage" --results-directory TestResults/${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.project }}
          path: TestResults/${{ matrix.project }}/**/coverage.cobertura.xml

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test tests/StepanCarService.E2ETests --filter Category=E2E

  vulnerable-packages:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore StepanCarSevice.Server.sln
      # Сборка падает, если найден уязвимый пакет
      - run: |
          dotnet list StepanCarSevice.Server.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
